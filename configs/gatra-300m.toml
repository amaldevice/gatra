name = "gatra-300m"
seed = 1337
device = "auto"

[data]
path = "data/sample.jsonl"
val_ratio = 0.02

# T2 mix lock: full-3T cluster profile (ID 15 / EN 52 / code 15 / math 10 / synth 7 + 1 SFT).
[data.mix]
id_web = 0.15
en_web = 0.52
code = 0.15
math = 0.10
synthetic = 0.07
instruction = 0.01

# T2 mix lock: Spark-full ~1T profile (ID-heavy 30% over 1T = 300B vs ~150B unique).
[data.mix_spark]
id_web = 0.30
en_web = 0.35
code = 0.15
math = 0.12
synthetic = 0.07
instruction = 0.01

# T6 extension-phase mix (8K ~80B + 16K ~20B = ~100B): long-doc heavy, ID-law anchor.
# Sources: id_law_long <- ipfs_indonesia_laws + ID_REG + indonesia-regulation (T6 verified);
# en_long <- EN long-docs/books fallback; id_web/en/code/math <- long-tail slices of bulk sources.
# Epoch-audited at build (hard-fail >4.0 per source); fallback: short-doc packing + EN-long.
[data.mix_long]
id_law_long = 0.35
id_web = 0.10
en_long = 0.35
code = 0.10
math = 0.10

[model]
n_embd = 960
n_head = 15
n_kv_heads = 3
n_layer = 28
n_ff = 2560
block_size = 4096
# T6 curriculum (locked): 2048 bulk ~2.6T -> 4096 ~300B -> 8K ~80B -> 16K ~20B (=3.0T).
# block_size here = training maximum (16K phase); bulk phases use shorter seq via loader.
# RoPE buffer must be sized to max 16384 from step-0 (T3 amendment per T6).
dropout = 0.0
rope_base = 500000.0  # T6 amendment: theta 500k from step-0, fixed (16K-ready, no retune)
norm_eps = 0.000001
vocab_size = 32768
use_qk_norm = true
z_loss_coef = 0.0

[train]
batch_size = 32
max_iters = 50000
eval_interval = 500
eval_iters = 50
learning_rate = 3e-4
warmup_iters = 1000
weight_decay = 0.1
grad_clip = 1.0
out_dir = "checkpoints"
sample_tokens = 80
sample_prompt_chars = 24
sample_count = 4

[generate]
max_new_tokens = 256
temperature = 0.8
top_k = 50
top_p = 0.9
